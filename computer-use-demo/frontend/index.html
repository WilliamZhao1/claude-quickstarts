<!DOCTYPE html>
<html>
<head>
    <title>Computer Use Agent</title>
    <style>
        body { display: flex; font-family: sans-serif; height: 100vh; margin: 0; }
        #chat-container { width: 400px; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
        #chat-history { flex: 1; overflow-y: auto; padding: 10px; background: #f9f9f9; }
        #input-area { padding: 10px; display: flex; }
        #desktop-container { flex: 1; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        .msg { margin-bottom: 8px; padding: 8px; border-radius: 4px; }
        .user { background: #e3f2fd; }
        .agent { background: #e8f5e9; }
        .tool { font-family: monospace; background: #eee; font-size: 0.85em; }
    </style>
</head>
<body>

<div id="chat-container">
    <div style="padding: 10px;">
        <button onclick="startSession()">1. Create New Session</button>
    </div>
    <div id="chat-history"></div>
    <div id="input-area">
        <input type="text" id="promptBox" style="flex:1;" placeholder="Ask the agent to do something..." disabled>
        <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
    </div>
</div>
<div id="desktop-container">
    <iframe id="vnc-frame" src=""></iframe>
</div>

<script>
    let ws;
    let sessionId;

    async function startSession() {
        const res = await fetch('/sessions', { method: 'POST' });
        const data = await res.json();
        sessionId = data.session_id;
        
        // Load the VNC interface for this specific session
        // Assuming Docker host is localhost for development
        document.getElementById('vnc-frame').src = `http://localhost:${data.vnc_port}/vnc.html`;
        
        connectWebSocket();
        document.getElementById('promptBox').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        appendMsg("System", "Session created and isolated environment provisioned.");
    }

    function connectWebSocket() {
        ws = new WebSocket(`ws://${location.host}/sessions/${sessionId}/stream`);
        
        ws.onmessage = function(event) {
            const msg = JSON.parse(event.data);
            if (msg.type === 'message') {
                appendMsg("Agent", msg.content, "agent");
            } else if (msg.type === 'progress') {
                appendMsg("System", msg.content, "tool");
            } else if (msg.type === 'tool_call') {
                appendMsg("Action", `Using ${msg.name}...`, "tool");
            } else if (msg.type === 'tool_result') {
                appendMsg("Result", msg.content, "tool");
            }
        };
    }

    function sendMessage() {
        const promptBox = document.getElementById('promptBox');
        const text = promptBox.value;
        if(!text) return;
        
        appendMsg("You", text, "user");
        ws.send(JSON.stringify({ prompt: text }));
        promptBox.value = '';
    }

    function appendMsg(sender, text, cssClass) {
        const div = document.createElement('div');
        div.className = `msg ${cssClass}`;
        div.innerHTML = `<strong>${sender}:</strong> ${text}`;
        document.getElementById('chat-history').appendChild(div);
        div.scrollIntoView();
    }
</script>

</body>
</html>
